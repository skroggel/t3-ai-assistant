services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # TYPO3 extension services.
  Madj2k\AiAssistant\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Chat/Domain/Model/*'
      - '../Classes/Config/*'
      - '../Classes/Connection/Domain/Model/*'
      - '../Classes/Domain/Model/*'
      - '../Classes/Indexing/Domain/Model/*'

  Madj2k\AiCore\:
    resource: '../../ai-core/src/*'

  # set public explictily
  Madj2k\AiAssistant\Assistant\TCA\PipelineCollectionItems:
    public: true

  Madj2k\AiAssistant\Assistant\TCA\PipelineProcessorItems:
    public: true

  Madj2k\AiAssistant\Assistant\TCA\ContractItems:
    public: true

  Madj2k\AiAssistant\Assistant\TCA\DecisionContractItems:
    public: true
    arguments:
      $contracts: !tagged_iterator 'aiassistant.assistant.contract.decision_contract'

  Madj2k\AiAssistant\Assistant\TCA\DecisionPayloadRetrieverItems:
    public: true

  Madj2k\AiAssistant\Controller\:
    resource: '../Classes/Controller/*'
    public: true

  Madj2k\AiAssistant\Connection\TCA\AiConnectorItems:
    public: true

  Madj2k\AiAssistant\Connection\TCA\VectorStoreConnectorItems:
    public: true

  Madj2k\AiAssistant\Indexing\TCA\AdapterItems:
    public: true

  Madj2k\AiAssistant\Indexing\TCA\ConnectorItems:
    public: true

  Madj2k\AiAssistant\Indexing\TCA\IndexerItems:
    public: true

  # define cli-commands
  Madj2k\AiAssistant\Command\ShopwareCleanupDeletedCommand:
    tags:
      - name: 'console.command'
        command: 'aiassistant:shopware:cleanup-deleted'

  Madj2k\AiAssistant\Command\ShopwareIndexCommand:
    tags:
      - name: 'console.command'
        command: 'aiassistant:shopware:index'

  Madj2k\AiAssistant\Command\ShopwareSmokeTestCommand:
    tags:
      - name: 'console.command'
        command: 'aiassistant:shopware:test'

  # define interfaces that act as tags
  _instanceof:
    Madj2k\AiCore\Assistant\Contract\ContractInterface:
      tags:
        - name: 'aiassistant.assistant.contract'

    Madj2k\AiCore\Assistant\Contract\DecisionContract\DecisionContractInterface:
      tags:
        - name: 'aiassistant.assistant.contract.decision_contract'

    Madj2k\AiCore\Assistant\Pipeline\Processor\ProcessorInterface:
      tags:
        - name: 'aiassistant.assistant.pipeline.processor'

    Madj2k\AiCore\Assistant\Prompt\Context\Builder\ContextBuilderInterface:
      tags:
        - name: 'aiassistant.assistant.prompt.context_builder'

    Madj2k\AiCore\Assistant\Tool\Provider\ToolProviderInterface:
      tags:
        - name: 'aiassistant.assistant.tool_provider'

    Madj2k\AiCore\Connection\Ai\AiConnectorInterface:
      tags:
        - name: 'aiassistant.connection.ai_connector'

    Madj2k\AiCore\Connection\VectorStore\VectorStoreConnectorInterface:
      tags:
        - name: 'aiassistant.connection.vector_store_connector'

    Madj2k\AiCore\Indexing\Adapter\AdapterInterface:
      tags:
        - name: 'aiassistant.indexing.adapter'

    Madj2k\AiCore\Indexing\Connector\ConnectorInterface:
      tags:
        - name: 'aiassistant.indexing.connector'

    Madj2k\AiCore\Indexing\Indexer\IndexerInterface:
      tags:
        - name: 'aiassistant.indexing.indexer'

  Madj2k\AiAssistant\Command\IndexFilesCommand:
    tags:
      - name: 'console.command'
        command: 'aiassistant:index:files'

  Madj2k\AiAssistant\Command\IndexPagesCommand:
    tags:
      - name: 'console.command'
        command: 'aiassistant:index:pages'

  # Aliasesfor autowireing
  Madj2k\AiCore\Assistant\Retrieval\RetrievalTargetProviderInterface:
    alias: Madj2k\AiAssistant\Assistant\Retrieval\Provider

  Madj2k\AiCore\Assistant\Log\PipelineLoggerInterface:
    alias: Madj2k\AiAssistant\Assistant\Log\PipelineLogger

  Madj2k\AiCore\Assistant\Presentation\Rules\PresentationRuleProviderInterface:
    alias: Madj2k\AiAssistant\Assistant\Presentation\Rules\PresentationRuleProvider

  Madj2k\AiCore\Assistant\Presentation\UIComponents\UIComponentProviderInterface:
    alias: Madj2k\AiAssistant\Assistant\Presentation\UIComponents\UIComponentProvider

  Madj2k\AiCore\Connection\VectorStore\Filter\FilterValueResolverInterface:
    alias: Madj2k\AiAssistant\Connection\VectorStore\Filter\TYPO3FilterValueResolver

  Madj2k\AiCore\Assistant\Memory\MemoryInterface:
    alias: Madj2k\AiAssistant\Assistant\Memory\SessionMemory

  Madj2k\AiCore\Assistant\Memory\SessionStoreInterface:
    alias: Madj2k\AiCore\Assistant\Memory\PhpSessionStore

  # providers
  Madj2k\AiAssistant\Backend\Configuration\BackendRegistryFieldProvider:
    arguments:
      $fieldContributors: !tagged_iterator 'aiassistant.backend.configuration.registry_field_contributor'

  # registries for services
  Madj2k\AiCore\Assistant\Contract\ContractRegistry:
    arguments:
      $contracts: !tagged_iterator 'aiassistant.assistant.contract'

  Madj2k\AiCore\Assistant\Contract\DecisionContract:
    arguments:
      $parts: !tagged_iterator 'aiassistant.assistant.contract.decision_contract'

  Madj2k\AiCore\Assistant\Pipeline\Registry\ProcessorRegistry:
    arguments:
      $processors: !tagged_iterator 'aiassistant.assistant.pipeline.processor'

  Madj2k\AiCore\Assistant\Prompt\Context\Registry\ContextBuilderRegistry:
    arguments:
      $builders: !tagged_iterator 'aiassistant.assistant.prompt.context_builder'

  Madj2k\AiCore\Assistant\Tool\Registry\ToolRegistry:
    arguments:
      $providers: !tagged_iterator 'aiassistant.assistant.tool_provider'

  Madj2k\AiCore\Indexing\Registry\IndexerRegistry:
    arguments:
      $indexers: !tagged_iterator 'aiassistant.indexing.indexer'

  # resolver based on given identifiers
  Madj2k\AiCore\Connection\Resolver\AiConnectorResolver:
    arguments:
      $connectors: !tagged_iterator 'aiassistant.connection.ai_connector'

  Madj2k\AiCore\Connection\Resolver\VectorStoreConnectorResolver:
    arguments:
      $connectors: !tagged_iterator 'aiassistant.connection.vector_store_connector'

  Madj2k\AiCore\Indexing\Resolver\AdapterResolver:
    arguments:
      $adapters: !tagged_iterator 'aiassistant.indexing.adapter'

  Madj2k\AiCore\Indexing\Resolver\IndexingConnectorResolver:
    arguments:
      $connectors: !tagged_iterator 'aiassistant.indexing.connector'

  # factories
  Madj2k\AiCore\Assistant\Memory\SessionMemory:
    factory: ['@Madj2k\AiAssistant\Assistant\Memory\MemoryFactory', 'create']
