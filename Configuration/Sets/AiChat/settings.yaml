aiAssistant:
  # Use the site-owned Vue integration template instead of the standalone custom element.
  # Keep this numeric because TypoScript conditions render boolean false as an empty constant.
  useVueIntegration: 0

  # Assistant profile UIDs allowed for public frontend requests.
  allowedAssistantProfiles: []

  # Lifetime of signed frontend request tokens in seconds.
  requestTokenTtl: 7200

  # Maximum serialized runtime-settings payload accepted by the chat endpoint.
  maxPayloadBytes: 524288
