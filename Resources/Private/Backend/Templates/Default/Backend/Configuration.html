{namespace core=TYPO3\CMS\Core\ViewHelpers}
<div class="aiassistant-config">
	<f:render partial="Backend/Module/Header" arguments="{_all}" />
	<f:render partial="Backend/Module/Navigation" arguments="{_all}" />

	<div class="aiassistant-config__card">
		<h2 class="aiassistant-config__subtitle"><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.central_configuration" /></h2>
		<p class="aiassistant-config__intro">
			<f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.central_configuration_intro" />
		</p>

		<form action="{formAction}" method="post" class="aiassistant-config__form">
			<input type="hidden" name="formToken" value="{formToken}" />

			<div class="aiassistant-config__table-wrap">
				<table class="aiassistant-config__table">
					<thead>
						<tr>
							<th><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.setting" /></th>
							<th><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.value" /></th>
							<th><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.status" /></th>
						</tr>
					</thead>
					<tbody>
						<f:for each="{registryFields}" as="field">
							<tr>
								<td>
									<strong><f:translate key="{field.label}" default="{field.label}" /></strong>
									<div class="aiassistant-config__hint"><f:translate key="{field.description}" default="{field.description}" /></div>
									<code class="aiassistant-config__key">{field.key}</code>
								</td>
								<td>
									<f:if condition="{field.type} == 'select'">
										<f:then>
											<select name="registry[{field.key}]" class="aiassistant-config__input{f:if(condition: field.hasError, then: ' aiassistant-config__input--error')}">
												<f:for each="{field.options}" as="option">
													<f:if condition="{option.value} == {field.value}">
														<f:then><option value="{option.value}" selected="selected"><f:translate key="{option.label}" default="{option.label}" /></option></f:then>
														<f:else><option value="{option.value}"><f:translate key="{option.label}" default="{option.label}" /></option></f:else>
													</f:if>
												</f:for>
											</select>
										</f:then>
										<f:else>
											<input
												name="registry[{field.key}]"
												type="{field.type}"
												value="{field.value}"
												maxlength="{field.maxLength}"
												class="aiassistant-config__input{f:if(condition: field.hasError, then: ' aiassistant-config__input--error')}"
											/>
										</f:else>
									</f:if>
									<f:if condition="{field.hasError}">
										<div class="aiassistant-config__error"><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.invalid_value" /></div>
									</f:if>
								</td>
								<td>
									<span class="aiassistant-config__badge aiassistant-config__badge--{field.statusClass}">
										{field.statusLabel}
									</span>
								</td>
							</tr>
						</f:for>
					</tbody>
				</table>
			</div>

			<div class="aiassistant-config__actions aiassistant-config__actions--card">
				<button type="submit" class="aiassistant-config__button"><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.save_configuration" /></button>
			</div>
		</form>
	</div>
</div>

<f:asset.script identifier="aiassistant-backend" src="EXT:ai_assistant/Resources/Public/JavaScript/Backend.js" />
