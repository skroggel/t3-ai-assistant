<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

    <f:asset.script
        identifier="ai-assistant-transport"
        src="EXT:ai_assistant/Resources/Public/JavaScript/ai-assistant-transport.js"
    />

    <f:asset.script
        identifier="ai-assistant-chat-vue"
        src="EXT:ai_assistant/Resources/Public/JavaScript/ai-assistant-chat.js"
    />

    <ai-assistant-chat
        endpoint="{f:uri.action(action: 'stream', controller: 'Chat', extensionName: 'AiAssistant', pluginName: 'Chat', pageType: '1790831370', arguments: '{id: pageUid}')}"
        assistant-profile="{assistantProfile.uid}"
        chat-identifier="{chatIdentifier}"
        request-token="{requestToken}"
        start-timestamp="{startTimestamp}"

        settings-json="{settingsJson -> f:format.htmlspecialchars()}"
        chat-options-json="{chatOptionsJson -> f:format.htmlspecialchars()}"
        labels-json="{labelsJson -> f:format.htmlspecialchars()}"
        ui-components-json="{uiComponentsJson -> f:format.htmlspecialchars()}"
        error-handling="{assistantProfile.errorHandling}"
        include-default-styles="{settings.includeDefaultStyles}"

        initial-message-delay="22"
        response-message-delay="14"

        initial-message="{initialMessage -> f:format.htmlspecialchars()}"
        assistant-name="{assistantProfile.assistantName -> f:format.htmlspecialchars()}"
        intro-text="{assistantProfile.introText -> f:format.htmlspecialchars()}"
        privacy-link="{f:uri.typolink(parameter: assistantProfile.privacyLink)}"

        require-consent="{settings.requireConsent}"
        show-language-selector="{settings.language.allowUserSelection}"

    ></ai-assistant-chat>

</html>
