{namespace core=TYPO3\CMS\Core\ViewHelpers}
<f:asset.script identifier="aiassistant-backend" src="EXT:ai_assistant/Resources/Public/JavaScript/Backend.js" />
<div class="aiassistant-config">
    <f:render partial="Backend/Module/Header" arguments="{_all}" />
    <f:render partial="Backend/Module/Navigation" arguments="{_all}" />


    <div class="aiassistant-config__card">
        <div class="aiassistant-config__section-header">
            <div>
                <h2>
                    <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs" />
                </h2>
                <p class="aiassistant-config__intro">
                    <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_intro" />
                </p>
            </div>
            <form action="{formAction}" method="post" class="aiassistant-config__inline-form" data-aiassistant-confirm="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_clear_confirm')}">
                <input type="hidden" name="formToken" value="{formToken}" />
                <button type="submit" name="purgeChatLog" value="1" class="aiassistant-config__button aiassistant-config__button--danger">
                    <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_clear" />
                </button>
            </form>
        </div>

        <form action="{formAction}" method="get" target="_top" class="aiassistant-config__form aiassistant-config__form--inline">
            <label for="aiassistant-pipeline-log-limit">
                <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_limit" />
            </label>
            <select id="aiassistant-pipeline-log-limit" name="limit" class="aiassistant-config__input">
                <f:for each="{0: 50, 1: 100, 2: 250, 3: 500}" as="limitOption">
                    <f:if condition="{limitOption} == {chatTraceLimit}">
                        <f:then>
                            <option value="{limitOption}" selected="selected">{limitOption}</option>
                        </f:then>
                        <f:else>
                            <option value="{limitOption}">{limitOption}</option>
                        </f:else>
                    </f:if>
                </f:for>
            </select>
            <label for="aiassistant-pipeline-log-chat-identifier">
                <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_chat_identifier" />
            </label>
            <input id="aiassistant-pipeline-log-chat-identifier" name="chatIdentifier" value="{chatTraceFilterChatIdentifier}" list="aiassistant-pipeline-log-chat-identifiers" class="aiassistant-config__input" />
            <datalist id="aiassistant-pipeline-log-chat-identifiers">
                <f:for each="{chatTraceChatIdentifiers}" as="chatIdentifierOption">
                    <option value="{chatIdentifierOption}">{chatIdentifierOption}</option>
                </f:for>
            </datalist>
            <button type="submit" class="aiassistant-config__button">
                <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.filter" />
            </button>
        </form>

        <div class="aiassistant-config__hint">
            <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_total" arguments="{0: chatTraceTotal}" />
        </div>

        <div class="aiassistant-config__table-wrap">
            <table class="aiassistant-config__table">
                <thead>
                    <tr>
                        <th>UID</th>
                        <th>Time</th>
                        <th>Level</th>
                        <th>Event</th>
                        <th>Conversation</th>
                        <th>Route</th>
                        <th>Payload</th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{chatTraces}" as="trace">
                        <tr>
                            <td>{trace.uid}</td>
                            <td>
                                <f:if condition="{trace.crdate}">
                                    <f:then><f:format.date format="Y-m-d H:i:s">{trace.crdate}</f:format.date></f:then>
                                    <f:else>-</f:else>
                                </f:if>
                            </td>
                            <td>
                                <span class="aiassistant-config__badge aiassistant-config__badge--soft">{trace.level}</span>
                            </td>
                            <td><code class="aiassistant-config__key">{trace.eventName}</code></td>
                            <td>{trace.chatIdentifier}</td>
                            <td>{trace.route}</td>
                            <td>
                                <pre class="aiassistant-config__pre" data-aiassistant-highlight-prompt-sections="1">{trace.payloadPretty}</pre>
                            </td>
                        </tr>
                    </f:for>
                    <f:if condition="{chatTraces -> f:count()} == 0">
                        <tr>
                            <td colspan="7">
                                <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang_config.xlf:templates_backend_config.pipeline_logs_empty" />
                            </td>
                        </tr>
                    </f:if>
                </tbody>
            </table>
        </div>
    </div>
</div>
