<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">


    <f:asset.css
        identifier="ai-assistant-frontend"
        href="EXT:ai_assistant/Resources/Public/Styles/Frontend.css"
    />

    <f:asset.script
        identifier="ai-assistant-marked"
        src="EXT:ai_assistant/Resources/Public/Libs/marked-18.0.5.umd.js"
    />

    <f:asset.script
        identifier="ai-assistant-purify"
        src="EXT:ai_assistant/Resources/Public/Libs/purify-3.4.10.min.js"
    />

    <f:asset.script
        identifier="ai-assistant-transport"
        src="EXT:ai_assistant/Resources/Public/JavaScript/AiAssistantTransport.js"
    />

    <f:asset.script
        identifier="ai-assistant-chat"
        src="EXT:ai_assistant/Resources/Public/JavaScript/AiAssistantChatBox.js"
    />

    <f:asset.script
        identifier="ai-assistant-frontend"
        src="EXT:ai_assistant/Resources/Public/JavaScript/Frontend.js"
    />

    <f:variable name="resolvedAssistantInitialMessage">
        <f:if condition="{assistantProfile.initialMessage}">
            <f:then>{assistantProfile.initialMessage}</f:then>
            <f:else><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.initial_message" /></f:else>
        </f:if>
    </f:variable>

    <f:variable name="resolvedErrorMessage">
        <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.error_message" />
    </f:variable>

    <section class="chat-box container py-4 js-aiassistant-container">
        <f:if condition="{settings.requireConsent}">
            <div class="chat-box-consent alert alert-warning js-aiassistant-consent" role="note">
                <p><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.consent_message" /></p>
                <button class="btn btn-primary js-aiassistant-init" type="button"><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.consent_button" /></button>
            </div>
        </f:if>

        <div class="chat-box-content js-aiassistant-chat-content" hidden="hidden">
            <f:form
                action="stream"
                controller="Chat"
                extensionName="AiAssistant"
                pluginName="Chat"
                pageType="1700000000"
                method="post"
                class="chat-box-form js-aiassistant-form"
                additionalAttributes="{data-initial-message: resolvedAssistantInitialMessage, data-error-message: resolvedErrorMessage, data-chat-options: chatOptionsJson}"
                novalidate="novalidate"
            >
                <header class="chat-box-header">
                    <div class="chat-box-header-top">
                        <p class="chat-box-brand">
                            <f:if condition="{assistantLabel}">
                                <f:then>{assistantLabel}</f:then>
                                <f:else><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.brand" /></f:else>
                            </f:if>
                        </p>

                        <f:comment><!-- Language selector --></f:comment>
                        <f:if condition="{showLanguageSelector}">
                            <div class="chat-box-header-actions">
                                <button
                                    class="btn btn-outline-secondary chat-box-language-toggle js-aiassistant-language-toggle"
                                    type="button"
                                    aria-expanded="false"
                                    aria-controls="aiassistant-language-panel-{contentElementUid}"
                                    data-label="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.response_language')}"
                                >
                                    <span aria-hidden="true">🌐</span>
                                    <span class="js-aiassistant-language-status"><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.response_language" /></span>
                                </button>
                                <button
                                    class="btn btn-outline-secondary chat-box-language-shortcut js-aiassistant-browser-language"
                                    type="button"
                                    hidden="hidden"
                                    data-label="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.use_browser_language')}"
                                ></button>
                            </div>
                        </f:if>
                    </div>

                    <f:comment><!-- Language selector menu--></f:comment>
                    <f:if condition="{showLanguageSelector}">
                        <div id="aiassistant-language-panel-{contentElementUid}" class="chat-box-language js-aiassistant-language-panel" hidden="hidden">
                            <label class="aiassistant-visually-hidden" for="aiassistant-language-{contentElementUid}">
                                <f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.response_language" />
                            </label>
                            <div class="chat-box-language-options">
                                <button
                                    class="btn btn-outline-secondary chat-box-language-option js-aiassistant-site-language"
                                    type="button"
                                    data-label="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.use_site_language')}"
                                ></button>
                                <div class="chat-box-language-input">
                                    <f:form.textfield
                                        id="aiassistant-language-{contentElementUid}"
                                        name="userLanguage"
                                        class="form-control js-aiassistant-language"
                                        list="aiassistant-languages-{contentElementUid}"
                                        maxlength="80"
                                        autocomplete="off"
                                        additionalAttributes="{dir: 'auto'}"
                                        placeholder="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.response_language_placeholder')}"
                                    />
                                    <button
                                        class="btn btn-primary js-aiassistant-language-apply"
                                        type="button"
                                        aria-label="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.apply_language')}"
                                        title="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.apply_language')}"
                                        disabled="disabled"
                                    >✓</button>
                                </div>
                            </div>
                            <datalist id="aiassistant-languages-{contentElementUid}">
                                <option value="Deutsch (de)"></option>
                                <option value="English (en)"></option>
                                <option value="Español (es)"></option>
                                <option value="Français (fr)"></option>
                                <option value="Italiano (it)"></option>
                                <option value="Polski (pl)"></option>
                                <option value="Português (pt)"></option>
                                <option value="Türkçe (tr)"></option>
                                <option value="العربية (ar)"></option>
                                <option value="فارسی (fa)"></option>
                                <option value="اردو (ur)"></option>
                                <option value="Русский (ru)"></option>
                                <option value="Українська (uk)"></option>
                                <option value="हिन्दी (hi)"></option>
                                <option value="বাংলা (bn)"></option>
                                <option value="中文 (zh)"></option>
                                <option value="日本語 (ja)"></option>
                                <option value="한국어 (ko)"></option>
                            </datalist>
                        </div>
                    </f:if>

                    <p class="chat-box-intro">
                        <f:if condition="{assistantIntroText}">
                            <f:then>{assistantIntroText}</f:then>
                            <f:else><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.intro" /></f:else>
                        </f:if>
                    </p>
                </header>

                <f:form.hidden name="assistantProfile" value="{assistantProfile.uid}" />
                <f:form.hidden name="chatIdentifier" value="{chatIdentifier}" />
                <f:form.hidden name="startTimestamp" value="{startTimestamp}" />
                <f:form.hidden name="settingsJson" value="{settingsJson}" />
                <f:form.hidden name="directInteraction" value="" class="js-aiassistant-direct-interaction" />

                <f:comment><!-- chatbox --></f:comment>
                <f:render partial="Index/ChatBox" arguments="{_all}" />

                <f:comment><!-- input field for chat --></f:comment>
                <div class="chat-box-prompt input-group mt-4">
                    <f:form.textfield
                        name="query"
                        class="chat-box-input form-control js-aiassistant-input"
                        placeholder="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.input_placeholder')}"
                        aria-label="{f:translate(key:'LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.input_aria_label')}"
                        additionalAttributes="{dir: 'auto'}"
                        required="required"
                        autocomplete="off"
                    />
                    <button class="btn btn-primary" type="submit"><f:translate key="LLL:EXT:ai_assistant/Resources/Private/Language/locallang.xlf:templates_index_index.submit" /></button>
                </div>
            </f:form>
        </div>
    </section>

</html>
